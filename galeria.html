<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Galeria d'imatges de Vilafranca del Penedès i el Penedès.">
    <title>Galeria | Portafoli d'Eric</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">Portafoli d’Eric</a>
        <nav aria-label="Navegació principal">
            <a href="index.html">Inici</a>
            <a href="projectes.html">Projectes</a>
            <a href="sobre-mi.html">Sobre mi</a>
            <a href="galeria.html" aria-current="page">Galeria</a>
            <a href="contacte.html">Contacte</a>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <p class="eyebrow">Projecte web</p>
            <h1>Vilafranca en imatges</h1>
            <p>Il·lustracions senzilles relacionades amb Vilafranca del Penedès i el seu entorn.</p>
        </section>

        <!-- Galeria en Flexbox; les imatges es poden substituir per les fotografies originals del projecte. -->
        <section class="content-section">
            <div class="gallery">
                <figure>
                    <img src="imatges/vinya.svg" alt="Il·lustració de vinyes verdes del Penedès">
                    <figcaption>Vinyes del Penedès</figcaption>
                </figure>
                <figure>
                    <img src="imatges/festa.svg" alt="Il·lustració d'una celebració amb focs artificials a la plaça">
                    <figcaption>Festa a la plaça</figcaption>
                </figure>
                <figure>
                    <img src="imatges/placa.svg" alt="Il·lustració d'una plaça de Vilafranca del Penedès">
                    <figcaption>Una plaça de Vilafranca</figcaption>
                </figure>
                <figure>
                    <img src="imatges/campanar.svg" alt="Il·lustració d'un campanar">
                    <figcaption>El campanar</figcaption>
                </figure>
                <figure>
                    <img src="imatges/most.svg" alt="Il·lustració d'un raïm madur">
                    <figcaption>El raïm</figcaption>
                </figure>
                <figure>
                    <img src="imatges/penedes.svg" alt="Il·lustració del paisatge de vinyes del Penedès">
                    <figcaption>El Penedès</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Eric Sánchez Gutiérrez</p>
    </footer>
</body>
</html>
